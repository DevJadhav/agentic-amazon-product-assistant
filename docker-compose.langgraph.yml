# Docker Compose configuration for LangGraph integration
# Extends the base docker-compose.yml with LangGraph-specific services

version: '3.8'

services:
  # PostgreSQL database for LangGraph state persistence
  postgres:
    image: postgres:15-alpine
    container_name: langgraph_postgres
    environment:
      POSTGRES_DB: langgraph_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/langgraph_integration/state/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - langgraph_network

  # Redis for caching and session management (optional)
  redis:
    image: redis:7-alpine
    container_name: langgraph_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - langgraph_network

  # Main application with LangGraph support
  langgraph_app:
    build:
      context: .
      dockerfile: Dockerfile.langgraph
    container_name: langgraph_app
    environment:
      # Database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: langgraph_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # API Keys (set in .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      
      # LangGraph configuration
      LANGGRAPH_ENABLE_PERSISTENCE: "true"
      LANGGRAPH_MAX_RETRIES: "3"
      LANGGRAPH_TIMEOUT: "30"
      
      # Performance settings
      LANGGRAPH_CACHE_TTL: "300"
      LANGGRAPH_MAX_SESSIONS: "1000"
      
    ports:
      - "8002:8000"  # FastAPI on different port
      - "8502:8501"  # Streamlit on different port
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - langgraph_network

  # Monitoring and observability
  prometheus:
    image: prom/prometheus:latest
    container_name: langgraph_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - langgraph_network

  grafana:
    image: grafana/grafana:latest
    container_name: langgraph_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - langgraph_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  langgraph_network:
    driver: bridge